# ติดตั้งบน VPS คู่กับ n8n (เครือข่ายภายในเดียวกัน ไม่เปิดพอร์ตออกอินเทอร์เน็ต)
services:
  aff-renderer:
    build: .
    container_name: aff-renderer
    restart: unless-stopped
    environment:
      - PUBLIC_BASE=${PUBLIC_BASE}
      - RENDER_TOKEN=${RENDER_TOKEN}
      - CONCURRENCY=2
      - KEEP_DAYS=30
    volumes:
      - aff_data:/data
    networks:
      - n8n_net
    mem_limit: 5g
  aff-studio:
    build: ./studio
    container_name: aff-studio
    restart: unless-stopped
    environment:
      - STUDIO_PASSWORD=${STUDIO_PASSWORD}
      - STUDIO_SECRET=${STUDIO_SECRET}
      - RENDER_TOKEN=${RENDER_TOKEN}
      - N8N_INTERNAL=${N8N_INTERNAL:-http://n8n:5678}
      - RENDERER_URL=http://aff-renderer:3000
      - SELF_INTERNAL=http://aff-studio:3100
    volumes:
      - aff_data:/data
    networks:
      - n8n_net
    mem_limit: 1g
  mcrich-db:
    image: postgres:16-alpine
    container_name: mcrich-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcrich
      - POSTGRES_DB=mcrich
      - POSTGRES_PASSWORD=${MCRICH_DB_PASSWORD}
    volumes:
      - mcrich_pg:/var/lib/postgresql/data
    networks:
      - n8n_net
    mem_limit: 512m
  mcrich-app:
    build: ./mcrich
    container_name: mcrich-app
    restart: unless-stopped
    depends_on:
      - mcrich-db
    environment:
      - DATABASE_URL=postgres://mcrich:${MCRICH_DB_PASSWORD}@mcrich-db:5432/mcrich
      - SESSION_SECRET=${MCRICH_SECRET}
      - PUBLIC_URL=${MCRICH_PUBLIC_URL}
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - PROMPTPAY_ID=${PROMPTPAY_ID:-}
      - PROMPTPAY_NAME=${PROMPTPAY_NAME:-}
      - RECEIVER_MATCH=${RECEIVER_MATCH:-}
      - EASYSLIP_KEY=${EASYSLIP_KEY:-}
      - SELLER_NAME=${SELLER_NAME:-}
      - SELLER_ADDRESS=${SELLER_ADDRESS:-}
      - SELLER_TAX_ID=${SELLER_TAX_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MCRICH_IMAGE_MODEL=${MCRICH_IMAGE_MODEL:-}
      - MCRICH_TTS_MODEL=${MCRICH_TTS_MODEL:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - LINEOA_SECRET=${LINEOA_SECRET:-}
      - LINEOA_TOKEN=${LINEOA_TOKEN:-}
      - LINEOA_ID=${LINEOA_ID:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - SCRAPECREATORS_API_KEY=${SCRAPECREATORS_API_KEY:-}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY:-}
      - FAL_KEY=${FAL_KEY:-}
      - GEMINI_CHAT_KEY=${GEMINI_CHAT_KEY:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_CONFIG_ID=${META_CONFIG_ID:-}
      - RENDER_TOKEN=${RENDER_TOKEN}
      - RENDERER_URL=http://aff-renderer:3000
    volumes:
      - aff_data:/data
    networks:
      - n8n_net
    mem_limit: 2g   # หนังสั้น/แกะคลิปใช้ ffmpeg หลายตัว (512m เคยโดน OOM)
volumes:
  aff_data:
  mcrich_pg:
networks:
  n8n_net:
    external: true
    name: ${N8N_NETWORK:-n8n_default}
