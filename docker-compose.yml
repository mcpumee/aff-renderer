# ติดตั้งบน VPS คู่กับ n8n (เครือข่ายภายในเดียวกัน ไม่เปิดพอร์ตออกอินเทอร์เน็ต)
services:
  aff-renderer:
    build: .
    container_name: aff-renderer
    restart: unless-stopped
    environment:
      - PUBLIC_BASE=${PUBLIC_BASE}
      - RENDER_TOKEN=${RENDER_TOKEN}
      - CONCURRENCY=2
      - KEEP_DAYS=30
    volumes:
      - aff_data:/data
    networks:
      - n8n_net
    mem_limit: 5g
  aff-studio:
    build: ./studio
    container_name: aff-studio
    restart: unless-stopped
    environment:
      - STUDIO_PASSWORD=${STUDIO_PASSWORD}
      - STUDIO_SECRET=${STUDIO_SECRET}
      - RENDER_TOKEN=${RENDER_TOKEN}
      - N8N_INTERNAL=${N8N_INTERNAL:-http://n8n:5678}
      - RENDERER_URL=http://aff-renderer:3000
      - SELF_INTERNAL=http://aff-studio:3100
    volumes:
      - aff_data:/data
    networks:
      - n8n_net
    mem_limit: 1g
volumes:
  aff_data:
networks:
  n8n_net:
    external: true
    name: ${N8N_NETWORK:-n8n_default}
